<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <title>星空觀景台 · 流星雨</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view" aria-label="Mount Rainier 夜空與流星雨，點一下星星可以看名字"></canvas>
    <div id="sky-labels" class="sky-labels" hidden aria-hidden="true"></div>
    <div id="star-marker" class="star-marker" hidden aria-hidden="true"></div>

    <div id="loading" class="loading">
      <div class="loading-title">星空觀景台</div>
      <div class="loading-sub" id="loading-sub">正在把 5,044 顆星放回天上…</div>
    </div>

    <header class="hud top">
      <div class="place">
        <div class="place-name" id="place">Reflection Lakes · Mount Rainier</div>
        <div class="place-time" id="clock">—</div>
      </div>
      <div class="counter" id="counter" title="這次已經看到的流星">流星 <b id="count">0</b></div>
    </header>

    <button class="hud fab" id="toggle" aria-label="設定" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2l2.4 6.9H22l-6 4.5 2.3 7L12 16l-6.3 4.4 2.3-7-6-4.5h7.6z"/></svg>
    </button>

    <aside class="hud panel" id="panel" hidden>
      <section>
        <h2>場景</h2>
        <div class="chips" id="scenes"></div>
        <p class="hint" id="scene-desc"></p>
      </section>
      <section>
        <h2>星空樣式</h2>
        <div class="chips" id="presets"></div>
        <p class="hint" id="preset-desc"></p>
      </section>
      <section>
        <h2>流星密度</h2>
        <div class="chips" id="rates"></div>
        <div class="dream-row" id="dream-row" hidden>
          <label for="dream">數量 <span class="val" id="dream-val"></span></label>
          <input type="range" id="dream" step="10" />
          <p class="hint" id="dream-warn" hidden>Rainier 湖畔有湖面倒影，夢幻模式流星很多時比較吃顯卡；覺得卡的話，可以換到「Rainier 草甸」或把數量調低。</p>
        </div>
      </section>
      <section>
        <h2>星座</h2>
        <div class="chips" id="constellations"></div>
      </section>
      <section>
        <h2>時間 <span class="val" id="time-val"></span></h2>
        <input type="range" id="time" min="21" max="29.5" step="0.05" />
        <div class="chips small" id="speeds"></div>
      </section>
      <section id="lake-section">
        <h2>湖面 <span class="val" id="wind-val"></span></h2>
        <input type="range" id="wind" min="0" max="1" step="0.01" />
      </section>
      <section class="row">
        <button class="btn" id="fireball" title="帶綠光、末端爆亮、留下餘跡">✦ 火流星</button>
        <button class="btn" id="long-meteor" title="慢慢劃過大半個天空">➶ 長流星</button>
        <button class="btn ghost" id="look-radiant">看輻射點</button>
      </section>
      <p class="hint">拖曳轉頭看四周 · 滾輪或雙指縮放 · 點一下星星看名字</p>
    </aside>

    <article class="star-card" id="star-card" hidden aria-live="polite">
      <button class="sc-close" id="sc-close" aria-label="關閉">×</button>
      <h3 id="sc-title"></h3>
      <div class="sc-sub" id="sc-sub"></div>
      <dl>
        <div><dt>拜耳名</dt><dd id="sc-bayer"></dd></div>
        <div><dt>星座</dt><dd id="sc-con"></dd></div>
        <div><dt>星等</dt><dd id="sc-mag"></dd></div>
        <div><dt>位置</dt><dd id="sc-pos"></dd></div>
      </dl>
      <p id="sc-text"></p>
    </article>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
