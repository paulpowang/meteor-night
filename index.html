<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <title>星空觀景台 · Rainier 流星雨</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view" aria-label="Mount Rainier 夜空與流星雨"></canvas>

    <div id="loading" class="loading">
      <div class="loading-title">星空觀景台</div>
      <div class="loading-sub">正在把 5,044 顆星放回天上…</div>
    </div>

    <header class="hud top">
      <div class="place">
        <div class="place-name">Reflection Lakes · Mount Rainier</div>
        <div class="place-time" id="clock">—</div>
      </div>
      <div class="counter" id="counter" title="這次已經看到的流星">流星 <b id="count">0</b></div>
    </header>

    <button class="hud fab" id="toggle" aria-label="設定" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2l2.4 6.9H22l-6 4.5 2.3 7L12 16l-6.3 4.4 2.3-7-6-4.5h7.6z"/></svg>
    </button>

    <aside class="hud panel" id="panel" hidden>
      <section>
        <h2>星空樣式</h2>
        <div class="chips" id="presets"></div>
        <p class="hint" id="preset-desc"></p>
      </section>
      <section>
        <h2>流星密度</h2>
        <div class="chips" id="rates"></div>
      </section>
      <section>
        <h2>時間 <span class="val" id="time-val"></span></h2>
        <input type="range" id="time" min="21" max="29.5" step="0.05" />
        <div class="chips small" id="speeds"></div>
      </section>
      <section>
        <h2>湖面 <span class="val" id="wind-val"></span></h2>
        <input type="range" id="wind" min="0" max="1" step="0.01" />
      </section>
      <section class="row">
        <button class="btn" id="fireball">✦ 來一顆火流星</button>
        <button class="btn ghost" id="look-radiant">看輻射點</button>
      </section>
      <p class="hint">拖曳轉頭看四周 · 滾輪或雙指縮放</p>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
